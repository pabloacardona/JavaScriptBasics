<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
    <link rel="stylesheet" href="estilos.css">

</head>
<body>
    <h2>Mi primer formulario</h2>

    <form>

        <label> Nombre: </label>
        <input type="text" placeholder="Ingrese su nombre"><br><br>


        <label> Email: </label>
        <input type="email" placeholder="Ingrese su email"><br><br>

        <label> Términos y condiciones: </label><br>
        <input type="checkbox" name="terminos"> Acepto los términos y condiciones<br><br>

        <a href="https://www.google.com" _blank>Ir a Google</a><br><br>

        <div style="text-align: center;">
            <img src="https://media1.tenor.com/m/9lfkOuaFDDsAAAAd/gatos-bailando.gif" alt="Google" width="150" height="150" align="center"><br><br>
        </div>

        <audio controls>
            <source src="sonidoGato.mp3" type="audio/mp3">
        </audio>

        <iframe width="560" height="315"
            src="https://www.youtube.com/embed/wv_dJvjuC04"
            title="Video de Gatos"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>

        <button type="submit">Enviar</button>

    </form>

</body>
</html>
